# ========================================================
# Personal Finance Management Platform - Database Configuration
# ========================================================

# Preferred Database Type: 'mysql' or 'sqlite'
# If set to 'mysql' but connection fails (e.g. invalid credentials or server not started),
# the platform automatically falls back to embedded SQLite so the project continues running without crashing.
db.type=mysql

# MySQL Configuration
db.mysql.url=jdbc:mysql://localhost:3306/finance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=root
db.mysql.password=root
db.mysql.driver=com.mysql.cj.jdbc.Driver

# SQLite Configuration (Embedded fallback file)
db.sqlite.url=jdbc:sqlite:finance.db
db.sqlite.driver=org.sqlite.JDBC

# HTTP Server Port
server.port=8080
